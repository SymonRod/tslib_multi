[package]
name = "stream-broadcast"
version = "0.1.0"
edition = "2021"
publish = false
description = "Publishes a video as a TeamSpeak 6 screen share (tslib-core + tslib-stream)"

[[bin]]
name = "stream-broadcast"
path = "src/main.rs"

[dependencies]
tslib-core = { path = "../../crates/tslib-core" }
tslib-stream = { path = "../../crates/tslib-stream" }

tokio = { version = "1.36", features = ["full"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
