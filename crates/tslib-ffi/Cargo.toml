[package]
name = "tslib-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FFI bindings for tslib - C, Python, and Java interop"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
tslib-core = { path = "../tslib-core" }
tslib-audio = { path = "../tslib-audio" }
tslib-chat = { path = "../tslib-chat" }
tslib-channel = { path = "../tslib-channel" }

tokio = { workspace = true, features = ["rt-multi-thread"] }
once_cell = "1.19"
tracing.workspace = true
tracing-subscriber.workspace = true

# For safer FFI
libc = "0.2"

[build-dependencies]
cbindgen.workspace = true
