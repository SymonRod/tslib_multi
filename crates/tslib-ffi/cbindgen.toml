# cbindgen configuration for generating C headers

language = "C"
include_guard = "TSLIB_H"
pragma_once = true
cpp_compat = true

header = """
/**
 * tslib - TeamSpeak 3 Client Library
 *
 * A modular, cross-platform library for building TeamSpeak 3 clients and bots.
 *
 * Usage:
 *   1. Call tslib_init() at startup
 *   2. Create an identity with tslib_identity_create() or tslib_identity_load()
 *   3. Connect with tslib_client_connect()
 *   4. Use the client functions to interact with the server
 *   5. Call tslib_client_free() to disconnect and cleanup
 *   6. Call tslib_shutdown() at exit
 *
 * Thread safety:
 *   - All functions are thread-safe
 *   - Callbacks may be called from any thread
 *
 * Memory management:
 *   - All returned pointers must be freed with the appropriate free function
 *   - Strings must be freed with tslib_string_free()
 */
"""

autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not edit manually. */"

[export]
include = ["TsLibError", "TsLibConnectionState", "TextMessageCallback", "ConnectionStateCallback"]

[enum]
rename_variants = "ScreamingSnakeCase"

[struct]
rename_fields = "snake_case"

[fn]
rename_args = "snake_case"
sort_by = "None"

[parse]
parse_deps = false
clean = false

[defines]
"target_os = windows" = "TSLIB_WINDOWS"
"target_os = macos" = "TSLIB_MACOS"
"target_os = linux" = "TSLIB_LINUX"
