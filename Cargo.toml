[workspace]
resolver = "2"
members = [
    "crates/tslib-core",
    "crates/tslib-audio",
    "crates/tslib-chat",
    "crates/tslib-channel",
    "crates/tslib-ffi",
    "crates/tslib-python",
    "crates/tslib-jni",
    "crates/tslib-bot",
    "crates/tslib-stream",
    "examples/simple-bot",
    "examples/voice-client",
    "examples/test-suite",
    "examples/send-msg",
    "examples/stream-capture",
    "examples/stream-broadcast",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Flamme"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/flamme/tslib"
description = "A modular TeamSpeak 3 client library"
rust-version = "1.75"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TeamSpeak protocol (tsclientlib)
# Fork of ReSpeak/tsclientlib: adds TeamSpeak 6 streaming properties and
# screen-share command declarations (published in 298e431). The declarations
# submodule points at SymonRod/tsdeclarations on the same branch.
tsclientlib = { git = "https://github.com/SymonRod/tsclientlib.git", branch = "ts6-client-is-streaming" }
tsproto = { git = "https://github.com/SymonRod/tsclientlib.git", branch = "ts6-client-is-streaming" }
tsproto-packets = { git = "https://github.com/SymonRod/tsclientlib.git", branch = "ts6-client-is-streaming" }
tsproto-types = { git = "https://github.com/SymonRod/tsclientlib.git", branch = "ts6-client-is-streaming" }

# Audio
opus = "0.3"
cpal = "0.15"
rubato = "0.14"  # Resampling

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# FFI
cbindgen = "0.26"

# Crypto
rand = "0.8"
base64 = "0.21"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
# Keep symbols in target/: a stripped .so makes Android tombstones unreadable
# (frame addresses with no function names). The copy packaged into the APK is
# stripped separately by build_android.sh / the Gradle buildRustLibs task.
strip = false
debug = 1
